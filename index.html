<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="container" id="container">
    <div class="form-container sign-up-container">
      <form id="signup-form">
        <h1>Create Account</h1>
        <input name="name" type="text" placeholder="Name" autocomplete="name" maxlength="80" required>
        <input name="email" type="email" placeholder="Email" autocomplete="email" maxlength="254" required>
        <input name="password" type="password" placeholder="Password" autocomplete="new-password" minlength="6" maxlength="128" required>
        <button type="submit">SIGN UP</button>
      </form>
    </div>
    <div class="form-container sign-in-container">
      <form id="login-form">
        <h1>Sign in</h1>
        <input name="email" type="email" placeholder="Email" autocomplete="email" maxlength="254" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="128" required>
        <button type="submit">SIGN IN</button>
      </form>
    </div>
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
           <p>A wonderful chance to join us! </p>
          <button class="ghost" id="signIn">SIGN IN</button>
        </div>
        <div class="overlay-panel overlay-right">
          <p>Camaan come and register up! </p>
          <button class="ghost" id="signUp">SIGN UP</button>
        </div>
      </div>
    </div>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
  <button id="logout" type="button" hidden>LOG OUT</button>
</body>
<script src="script.js"></script>

</html>
